<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minzoto IA | MINZOTO Lab</title>
<meta name="description" content="Minzoto, l'assistant IA de MINZOTO Lab : design graphique, communication visuelle, génération d'images et toutes tes questions.">
<meta name="theme-color" content="#0b0b0d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MINZOTO Lab">
<meta property="og:title" content="Minzoto IA | MINZOTO Lab">
<meta property="og:description" content="Pose tes questions, crée des images, améliore tes designs. L'assistant IA de MINZOTO Lab.">
<meta property="og:url" content="https://minzotolab.github.io/ia/">
<meta property="og:image" content="https://minzotolab.github.io/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minzoto IA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b0b0d; --side:#101013; --panel:#16161a; --panel2:#1d1d22; --line:#26262c; --line2:#34343c;
  --text:#f3f3f5; --mut:#9b9ba6; --dim:#6d6d78; --gold:#ffdd12; --gold2:#e7b928; --danger:#ff6b6b; --ok:#4ade80;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.app{height:100%;display:flex;position:relative}

/* ---------- barre latérale ---------- */
.side{width:292px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;z-index:30;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.side-top{padding:calc(14px + var(--safe-t)) 14px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.01em;font-size:18px}
.brand img{width:34px;height:34px;border-radius:10px;display:block}
.brand b{color:var(--gold);font-weight:800}
.newchat{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--gold);color:#000;font-weight:700}
.newchat:active{transform:scale(.98)}
.side-label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:10px 20px 6px}
.hist{flex:1;overflow:auto;padding:0 10px 10px}
.hist::-webkit-scrollbar{width:6px}.hist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.hitem{display:flex;align-items:center;gap:6px;border-radius:12px;padding:0 4px 0 12px}
.hitem:hover,.hitem.on{background:var(--panel)}
.hitem .t{flex:1;min-width:0;text-align:left;padding:10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;color:#dcdce2}
.hitem.on .t{color:#fff}
.hitem .del{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--dim);opacity:0}
.hitem:hover .del,.hitem.on .del{opacity:1}
.hitem .del:hover{color:var(--danger);background:var(--panel2)}
.hnote{padding:14px 12px;color:var(--dim);font-size:13.5px;line-height:1.5}
.side-bot{border-top:1px solid var(--line);padding:12px 14px calc(12px + var(--safe-b));display:flex;flex-direction:column;gap:8px}
.userbox{display:flex;align-items:center;gap:11px;padding:6px 4px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--gold);overflow:hidden;flex:none;border:1px solid var(--line2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.uinfo{flex:1;min-width:0}
.uinfo b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uinfo span{display:block;font-size:12.5px;color:var(--mut)}
.sbtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#d6d6dc;font-size:14.5px;width:100%;text-align:left}
.sbtn:hover{background:var(--panel)}
.sbtn.gold{background:var(--panel2);color:var(--gold);font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
@media(max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);width:min(86vw,320px);box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .app.open .side{transform:none}
  .app.open .scrim{opacity:1;pointer-events:auto}
}

/* ---------- zone principale ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative;
  background:radial-gradient(700px 360px at 50% -80px,rgba(255,221,18,.09),transparent 70%),var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 8px;min-height:60px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:#d9d9df}
.iconbtn:hover{background:var(--panel)}
.top .ttl{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.top .ttl em{font-style:normal;color:var(--gold)}
.quota{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.quota svg{width:16px;height:16px;color:var(--gold)}
.quota b{color:var(--text)}
@media(min-width:861px){#menuBtn{display:none}}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth;padding:6px 0 18px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.col{max-width:780px;margin:0 auto;padding:0 16px}

/* accueil */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 16px 24px}
.orb{width:92px;height:92px;position:relative;margin-bottom:18px}
.orb img{width:100%;height:100%;border-radius:26px;display:block;position:relative;z-index:1;box-shadow:0 10px 40px rgba(255,221,18,.22)}
.orb::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,221,18,.35),transparent 72%);animation:breathe 4.2s ease-in-out infinite}
.orb i{position:absolute;z-index:2;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);border-radius:1px;animation:tw 2.6s ease-in-out infinite;box-shadow:0 0 10px var(--gold)}
.orb i:nth-of-type(1){top:-8px;right:-4px}.orb i:nth-of-type(2){bottom:2px;left:-14px;animation-delay:.9s;width:5px;height:5px}.orb i:nth-of-type(3){top:22px;right:-22px;animation-delay:1.7s;width:4px;height:4px}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes tw{0%,100%{opacity:.2;transform:rotate(45deg) scale(.6)}50%{opacity:1;transform:rotate(45deg) scale(1.2)}}
.hello{font-size:clamp(28px,6vw,40px);font-weight:800;margin:0;line-height:1.15;letter-spacing:-.01em}
.hello span{background:linear-gradient(90deg,#fff 0%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);max-width:520px;margin:12px 0 26px;font-size:15.5px}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.sg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:9px;transition:border-color .2s,transform .15s,background .2s}
.sg:hover{border-color:rgba(255,221,18,.5);background:var(--panel2)}
.sg:active{transform:scale(.98)}
.sg .ic{width:36px;height:36px;border-radius:11px;background:rgba(255,221,18,.1);color:var(--gold);display:grid;place-items:center}
.sg b{font-size:14.5px;line-height:1.3}
.sg span{font-size:12.5px;color:var(--mut);line-height:1.4}
@media(max-width:420px){.sugg{gap:8px}.sg{padding:12px}.sg span{display:none}}

/* messages */
.msg{display:flex;gap:12px;padding:14px 0;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.u{justify-content:flex-end}
.bub{max-width:86%;background:var(--panel2);border:1px solid var(--line);border-radius:20px 20px 6px 20px;padding:11px 15px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.bub .att{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bub .att img{width:92px;height:92px;object-fit:cover;border-radius:12px;display:block}
.av{width:32px;height:32px;border-radius:10px;flex:none;margin-top:2px}
.av img{width:100%;height:100%;border-radius:10px;display:block}
.body{flex:1;min-width:0}
.txt{overflow-wrap:anywhere}
.txt p{margin:0 0 .75em}.txt p:last-child{margin-bottom:0}
.txt h1,.txt h2,.txt h3{margin:1.1em 0 .45em;line-height:1.3;font-size:1.08em}
.txt h1{font-size:1.2em}
.txt ul,.txt ol{margin:.3em 0 .8em;padding-left:1.35em}.txt li{margin:.22em 0}
.txt a{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.txt code{background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
.txt pre{background:#0f0f12;border:1px solid var(--line);border-radius:14px;padding:0;margin:.6em 0 .9em;overflow:hidden}
.txt pre .ph{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--panel);font-size:12px;color:var(--mut)}
.txt pre .ph button{color:var(--mut);display:flex;gap:6px;align-items:center;font-size:12px}
.txt pre .ph button:hover{color:var(--gold)}
.txt pre code{display:block;padding:12px;background:none;overflow:auto;font-size:13.5px;line-height:1.5}
.txt strong{color:#fff}
.sw{display:inline-block;width:.9em;height:.9em;border-radius:4px;background:var(--c);vertical-align:-.1em;margin-right:.3em;border:1px solid rgba(255,255,255,.35)}
.acts{display:flex;gap:2px;margin-top:6px;margin-left:-8px}
.acts button{width:34px;height:34px;border-radius:9px;color:var(--dim);display:grid;place-items:center}
.acts button:hover{background:var(--panel);color:var(--text)}
.acts svg.i{width:18px;height:18px}
.cursor{display:inline-block;width:8px;height:1.05em;background:var(--gold);vertical-align:-.15em;margin-left:2px;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.think{display:flex;gap:5px;padding:8px 0}
.think i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dot 1.2s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.18s}.think i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1.05)}}
.err{color:#ffb4b4;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);border-radius:14px;padding:11px 14px;font-size:14.5px}

/* image générée */
.imgcard{width:min(100%,440px);border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.imgbox{position:relative;aspect-ratio:1/1;background:var(--panel2);overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s}
.imgbox img.ok{opacity:1}
.imgbox .sk{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,221,18,.12) 50%,transparent 70%),var(--panel2);background-size:220% 100%;animation:sh 1.6s linear infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:14px;text-align:center;padding:16px}
.imgbox .sk svg{width:34px;height:34px;color:var(--gold);animation:breathe 2s ease-in-out infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.imgbar{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:13.5px;font-weight:600}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.pill svg.i{width:17px;height:17px}

/* zone de saisie */
.dock{padding:6px 12px calc(10px + var(--safe-b));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.comp{max-width:780px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:26px;padding:8px 8px 8px 8px;transition:border-color .2s,box-shadow .2s}
.comp:focus-within{border-color:rgba(255,221,18,.55);box-shadow:0 0 0 4px rgba(255,221,18,.07)}
.comp.imgmode{border-color:rgba(255,221,18,.6)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 6px 6px}
.chip{position:relative}
.chip img{width:62px;height:62px;border-radius:12px;object-fit:cover;display:block;border:1px solid var(--line2)}
.chip button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.chip button svg{width:12px;height:12px;stroke-width:3}
.modebar{display:flex;align-items:center;gap:8px;padding:4px 10px 2px;font-size:13px;color:var(--gold);font-weight:600}
textarea#inp{width:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;padding:10px 12px;max-height:170px;min-height:24px;display:block;line-height:1.5}
textarea#inp::placeholder{color:var(--dim)}
.crow{display:flex;align-items:center;gap:4px;padding:0 2px}
.crow .sp{flex:1}
.cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#cfcfd6;transition:background .15s,color .15s}
.cb:hover{background:var(--panel2);color:#fff}
.cb.tog{width:auto;padding:0 14px 0 11px;border-radius:999px;gap:7px;display:flex;align-items:center;font-size:14px;font-weight:600;border:1px solid var(--line2);height:40px}
.cb.tog.on{background:var(--gold);color:#000;border-color:var(--gold)}
.cb.rec{background:var(--danger);color:#fff;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.55)}100%{box-shadow:0 0 0 16px rgba(255,107,107,0)}}
.send{background:var(--gold);color:#000}
.send:hover{background:#ffe94d;color:#000}
.send:disabled{background:var(--panel2);color:var(--dim);cursor:default}
.send.stop{background:#fff}
.foot{text-align:center;font-size:11.5px;color:var(--dim);margin-top:8px;padding:0 10px}

/* fenêtres */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:24px 22px;width:100%;max-width:400px;max-height:92vh;overflow:auto;position:relative;animation:rise .25s ease both}
.card h3{margin:0 0 6px;font-size:21px}
.card p{color:var(--mut);font-size:14.5px;margin:0 0 16px}
.card .x{position:absolute;top:12px;right:12px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px;border-radius:14px;background:#fff;color:#1f1f1f;font-weight:700;font-size:15.5px}
.gbtn svg{width:22px;height:22px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.field{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:14px;color:var(--text);font:inherit;padding:13px 14px;outline:0;margin-bottom:10px}
.field:focus{border-color:var(--gold)}
.pbtn{width:100%;padding:13px;border-radius:14px;background:var(--gold);color:#000;font-weight:800}
.pbtn:disabled{opacity:.6}
.ghost{width:100%;padding:12px;border-radius:14px;color:var(--mut);margin-top:6px;font-size:14.5px}
.ghost:hover{color:var(--text)}
.note{font-size:13px;margin-top:10px;min-height:18px;color:var(--danger)}
.note.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

</svg>

<div class="app" id="app">
  <aside class="side" id="side">

/* ================= Rendu : texte (mini Markdown sûr) ================= */
function md(src){
  const blocks = [];
  let s = String(src).replace(/```([a-zA-Z0-9+#_-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push('<pre><div class="ph"><span>' + esc(lang || "code") + '</span><button data-copycode>' + ico("copy") + 'Copier</button></div><code>' + esc(code.replace(/\n$/, "")) + '</code></pre>');
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  s = esc(s);
  const inline = t => t
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(>])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/#([0-9a-fA-F]{6})\b(?![^<]*>)/g, '<span class="sw" style="--c:#$1"></span>#$1');
  const out = []; let list = null;
  const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  s.split("\n").forEach(line => {
    let m;
    if (/^\u0000\d+\u0000$/.test(line.trim())) { close(); out.push(line.trim()); }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { close(); out.push("<h3>" + inline(m[2]) + "</h3>"); }
    else if (!line.trim()) { close(); out.push(""); }
    else { close(); out.push("<p>" + inline(line) + "</p>"); }
  });
  close();
  return out.join("\n").replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
}

  }

function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const r = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      const out = c.toDataURL("image/jpeg", 0.85);
      res({ mime: "image/jpeg", data: out.split(",")[1], url: out });
    };
    im.onerror = () => rej(new Error("image"));
    im.src = url;
  });
}

/* ----- dictée vocale ----- */

let rec = null, recOn = false, recBase = "";
$("micBtn").onclick = () => {
  if (!SR) { toast("La dictée vocale n'est pas disponible sur ce navigateur. Essaie avec Chrome."); return; }
  if (recOn) { stopRec(); return; }

  recBase = inp.value ? inp.value.replace(/\s+$/, "") + " " : "";

  rec.onresult = ev => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalT += t + " "; else interim += t;
    }
    inp.value = recBase + finalT + interim; fit();
  };
  rec.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") toast("Autorise le micro pour dicter ton message.");
    else if (ev.error === "no-speech") toast("Je n'ai rien entendu. Réessaie.");
    else if (ev.error !== "aborted") toast("Dictée impossible (" + ev.error + ")");
    stopRec(true);
  };
  rec.onend = () => { if (recOn) { recBase = inp.value.replace(/\s+$/, "") + " "; finalT = ""; try { rec.start(); } catch (e) { stopRec(true); } } };
  try { rec.start(); recOn = true; $("micBtn").classList.add("rec"); toast("Je t'écoute… touche le micro pour arrêter"); } catch (e) { toast("Micro indisponible"); }
};
function stopRec(silent){
  recOn = false; $("micBtn").classList.remove("rec");
  try { rec && rec.stop(); } catch (e) {}
  inp.value = inp.value.trim(); fit();
}

/* ----- suggestions, copier, écouter ----- */
col.addEventListener("click", e => {
  const sgb = e.target.closest(".sg");
  if (sgb) {
    const p = sgb.getAttribute("data-prompt");
    if (p === "__attach__") { $("file").click(); inp.value = "Analyse ce design : points forts, points faibles et améliorations concrètes."; fit(); }
    else if (p === "__image__") { $("imgBtn").click(); }
    else { inp.value = p; fit(); send(); }
    return;
  }
  const msg = e.target.closest(".msg");
  if (e.target.closest("[data-copycode]")) {
    const code = e.target.closest("pre").querySelector("code").textContent;
    navigator.clipboard.writeText(code).then(() => toast("Code copié"), () => toast("Copie impossible")); return;
  }
  if (e.target.closest("[data-copy]") && msg) {
    const m = cur.messages[+msg.getAttribute("data-i")]; navigator.clipboard.writeText(m.t || "").then(() => toast("Texte copié"), () => toast("Copie impossible")); return;
  }
  if (e.target.closest("[data-speak]") && msg) {
    const m = cur.messages[+msg.getAttribute("data-i")];
    if (!("speechSynthesis" in window)) { toast("Lecture vocale indisponible"); return; }
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
    const u = new SpeechSynthesisUtterance(String(m.t || "").replace(/[*#`_>\[\]()]/g, "").replace(/https?:\/\/\S+/g, "")); u.lang = CONFIG.LANG_VOICE; speechSynthesis.speak(u); return;
  }
  if (e.target.closest("[data-dl]") && msg) {
    const m = cur.messages[+msg.getAttribute("data-i")];
    downloadImage(m.u, "minzoto-" + Date.now()); return;
  }
  const rd = e.target.closest("[data-redo]");
  if (rd) { if (busy) return; makeImage(rd.getAttribute("data-p"), [], true); }
});
async function downloadImage(url, name){
  try {
    const r = await fetch(url, { mode: "cors" }); const b = await r.blob(); const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name + ".jpg"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } catch (e) { window.open(url, "_blank", "noopener"); toast("Appuie longtemps sur l'image pour l'enregistrer"); }
}

/* ================= Intelligence artificielle (Gemini via Firebase AI Logic) ================= */
function systemPrompt(){
  const n = firstName();
  return "Tu es Minzoto, l'assistant IA de MINZOTO Lab, un studio créatif en RDC (logos, affiches, portraits numériques, retouche photo, marques de vêtements, identités visuelles). " +
    "Réponds dans la langue de l'utilisateur (français par défaut). Donne des réponses concrètes, exactes et bien structurées, sans remplissage ni phrases creuses. Si tu n'es pas sûr, dis-le ; n'invente jamais de faits, de chiffres, de sources, de prix ni de contacts. " +
    "Tu réponds à toutes les questions générales (savoir, école, travail, technologie, business, santé générale, vie pratique, rédaction, calcul, code…). Pour la santé, le droit et la finance, informe clairement et recommande un professionnel pour les décisions importantes. Refuse poliment ce qui est dangereux ou illégal. " +
    "Ta spécialité est le design graphique et toute la communication visuelle : identité de marque, logotypes, typographie, théorie des couleurs (donne les codes HEX), composition, hiérarchie visuelle, affiches, flyers, réseaux sociaux, packaging, mode, impression (CMJN, fonds perdus, résolution), et les outils (Photoshop, Illustrator, Canva, Figma, CorelDRAW). Dans ce domaine, sois précis comme un directeur artistique : donne des valeurs, des exemples et des étapes applicables. " +
    "Quand l'utilisateur envoie une image, analyse-la réellement : ce que tu vois, les forces, les faiblesses, puis des améliorations concrètes. " +
    "Si on te demande de créer ou dessiner une image, explique qu'il suffit de toucher le bouton « Image » (3 images gratuites par jour pour les personnes connectées) ou d'écrire « génère une image de… ». " +
    "Pour un vrai projet ou un devis de design, invite à contacter MINZOTO Lab sur WhatsApp (+" + CONFIG.WHATSAPP + ") ou via le formulaire de devis du site " + CONFIG.SITE + ". " +
    "Style : chaleureux, professionnel, clair ; utilise des listes courtes et du gras seulement quand cela aide. " + (n ? "L'utilisateur s'appelle " + n + "." : "");
}
async function getModel(force){
  if (!aiMod) aiMod = await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-ai.js");
  if (!aiInst) aiInst = aiMod.getAI(fbApp, { backend: new aiMod.GoogleAIBackend() });
  const names = modelName && !force ? [modelName] : CONFIG.MODELS;
  return { names };
}
function makeModel(name){
  return aiMod.getGenerativeModel(aiInst, { model: name, systemInstruction: systemPrompt(), generationConfig: { temperature: 0.7 } });
}
function toContents(msgs, withAttach){
  const out = [];
  msgs.forEach((m, idx) => {
    if (m.err) return;
    const role = m.r === "u" ? "user" : "model";
    const parts = [];
    let t = m.t || "";
    if (m.u) t = "[Image créée pour : " + (m.p || "") + "]" + (t ? "\n" + t : "");
    if (m.r === "u" && withAttach && idx === msgs.length - 1 && m.raw) m.raw.forEach(a => parts.push({ inlineData: { mimeType: a.mime, data: a.data } }));
    parts.push({ text: t || "(image)" });
    if (out.length && out[out.length - 1].role === role) out[out.length - 1].parts.push(...parts); else out.push({ role, parts });
  });
  while (out.length && out[0].role !== "user") out.shift();
  return out;
}
function friendly(e){
  const m = String((e && (e.message || e.code)) || e || "");
  if (DEBUG) console.error(e);
  if (/quota|429|resource.?exhausted|rate/i.test(m)) return "Je suis très sollicité en ce moment. Réessaie dans une minute.";
  if (/network|fetch|failed to fetch|offline|ERR_/i.test(m)) return "Pas de connexion internet. Vérifie ton réseau puis réessaie.";
  if (/safety|blocked|prohibited/i.test(m)) return "Je ne peux pas répondre à cette demande. Essaie de la reformuler.";
  if (/api.?not.?enabled|has not been used|disabled|permission|403|app.?check|API key/i.test(m)) return "Le service d'intelligence artificielle n'est pas encore activé. Réessaie plus tard ou contacte MINZOTO Lab." + (DEBUG ? " [" + m.slice(0, 200) + "]" : "");
  return "Une erreur est survenue. Réessaie dans un instant." + (DEBUG ? " [" + m.slice(0, 200) + "]" : "");
}
async function streamAnswer(contents, el){
  const { names } = await getModel();
  let lastErr = null;
  for (const name of names) {
    try {
      const mod = makeModel(name);
      const res = await mod.generateContentStream({ contents });
      let acc = "";
      for await (const ch of res.stream) {
        if (abortFlag) break;
        acc += ch.text(); modelName = name;
        el.innerHTML = md(acc) + '<span class="cursor"></span>'; scrollDown();
      }
      modelName = name;
      return acc;
    } catch (e) {
      lastErr = e;
      if (!/not.?found|404|not supported|unsupported|invalid model/i.test(String(e && e.message))) throw e;
    }
  }
  throw lastErr || new Error("no model");
}
async function oneShot(contents){
  const { names } = await getModel();
  let lastErr = null;
  for (const name of names) {
    try { const r = await makeModel(name).generateContent({ contents }); modelName = name; return r.response.text(); }
    catch (e) { lastErr = e; if (!/not.?found|404|not supported|unsupported|invalid model/i.test(String(e && e.message))) throw e; }
  }
  throw lastErr || new Error("no model");
}

/* ================= Envoi d'un message ================= */
const IMG_INTENT = /^\s*(g[ée]n[èe]re|cr[ée]+|dessine|fais|r[ée]alise|produis|imagine|generate|create|draw|make)\b[^.?!\n]{0,60}\b(image|photo|illustration|visuel|affiche|dessin|portrait|banni[èe]re|flyer|poster|wallpaper|fond d'[ée]cran)\b/i;
async function send(){
  if (busy) return;
  if (recOn) stopRec();
  const text = inp.value.trim();
  if (!text && !attach.length) return;
  if (!cur) newChat();
  const files = attach.slice();
  const wantImage = imageMode || IMG_INTENT.test(text);
  if (wantImage && !user) { openLogin("Connecte-toi pour créer jusqu'à " + CONFIG.DAILY_IMAGES + " images gratuites par jour."); return; }
  inp.value = ""; fit(); attach = []; renderChips();
  if (wantImage) { setImageMode(false); await makeImage(text, files, false); return; }

  const um = { r: "u", t: text || "Analyse cette image.", a: files.map(f => f.url), raw: files };
  cur.messages.push(um);
  if (!cur.title) { cur.title = (text || "Analyse d'image").slice(0, 44); $("ttl").textContent = cur.title; }
  renderChat();
  const am = { r: "m", t: "" };
  cur.messages.push(am);
  col.insertAdjacentHTML("beforeend", msgHTML(am, cur.messages.length - 1));
  const el = col.lastElementChild.querySelector(".txt");
  el.innerHTML = '<div class="think"><i></i><i></i><i></i></div>';
  col.lastElementChild.querySelector(".acts").classList.add("hidden");
  scrollDown(true);
  setBusy(true); abortFlag = false;
  try {
    const contents = toContents(cur.messages.slice(0, -1), true);
    const out = await streamAnswer(contents, el);
    am.t = out || (abortFlag ? "(réponse interrompue)" : "…");
    el.innerHTML = md(am.t);
  } catch (e) {
    am.t = friendly(e); am.err = true; el.innerHTML = '<div class="err">' + esc(am.t) + '</div>';
  }
  col.lastElementChild.querySelector(".acts").classList.remove("hidden");
  cur.messages.forEach(m => { delete m.raw; });
  setBusy(false); scrollDown();
  if (!am.err) { await store.save(cur); await refreshList(); }
}
async function refreshList(){ chats = await store.list(); renderHist(); }

/* ================= Création d'images (3 par jour) ================= */
async function loadQuota(){
  if (!user) { imagesLeft = CONFIG.DAILY_IMAGES; showQuota(); return; }
  try {
    const s = await getDoc(doc(db, "users", user.uid, "usage", dayKey()));
    imagesLeft = Math.max(0, CONFIG.DAILY_IMAGES - (s.exists() ? (s.data().count || 0) : 0));
  } catch (e) { imagesLeft = CONFIG.DAILY_IMAGES; }
  showQuota();
}
function showQuota(){ $("qLeft").textContent = imagesLeft; $("quota").style.opacity = user ? 1 : .7; }
async function useQuota(){
  const ref = doc(db, "users", user.uid, "usage", dayKey());
  await runTransaction(db, async tx => {
    const s = await tx.get(ref); const c = s.exists() ? (s.data().count || 0) : 0;
    if (c >= CONFIG.DAILY_IMAGES) throw new Error("LIMIT");
    tx.set(ref, { count: c + 1 });
  });
  imagesLeft = Math.max(0, imagesLeft - 1); showQuota();
}
async function makeImage(text, files, again){
  if (busy) return;
  if (!user) { openLogin("Connecte-toi pour créer jusqu'à " + CONFIG.DAILY_IMAGES + " images gratuites par jour."); return; }
  await loadQuota();
  if (imagesLeft <= 0) {
    cur.messages.push({ r: "u", t: text });
    cur.messages.push({ r: "m", t: "Tu as utilisé tes " + CONFIG.DAILY_IMAGES + " images gratuites d'aujourd'hui. Elles reviennent demain. En attendant, je peux t'aider à préparer ton idée : couleurs, composition, texte, style.", err: false });
    renderChat(); return;
  }
  if (!cur) newChat();
  if (!cur.title) { cur.title = ("Image : " + text).slice(0, 44); $("ttl").textContent = cur.title; }
  if (!again) cur.messages.push({ r: "u", t: text || "Crée une image.", a: files.map(f => f.url) });
  renderChat();
  setBusy(true); abortFlag = false;
  // 1) l'IA transforme la demande en description détaillée pour le générateur d'images
  let prompt = text;
  try {
    const parts = [];
    files.forEach(a => parts.push({ inlineData: { mimeType: a.mime, data: a.data } }));
    parts.push({ text: "Tu écris des prompts pour un générateur d'images (modèle Flux). Transforme la demande suivante en UN prompt en anglais de 40 à 90 mots : sujet précis, style (photographie, illustration, 3D, affiche graphique…), composition, éclairage, palette de couleurs, ambiance, qualité. " +
      (files.length ? "Des images de référence sont jointes : décris fidèlement leur sujet, leurs couleurs et leur style, et reprends-les dans le prompt. " : "") +
      "N'ajoute aucun texte écrit dans l'image sauf si la demande l'exige (le texte généré par IA est souvent déformé). Réponds uniquement avec le prompt, sans guillemets.\n\nDemande : " + text });
    const p = (await oneShot([{ role: "user", parts }])).trim().replace(/^["'`]+|["'`]+$/g, "");
    if (p.length > 15) prompt = p.slice(0, 900);
  } catch (e) { if (DEBUG) console.error(e); }
  // 2) la demande est envoyée au générateur d'images
  const seed = Math.floor(Math.random() * 1e9);
  const url = CONFIG.IMAGE_URL(prompt, seed);
  const m = { r: "m", t: "", u: url, p: text };
  cur.messages.push(m);
  renderChat();
  const box = col.lastElementChild.querySelector(".imgbox");
  const okImg = await new Promise(res => {
    const done = () => res(!!box.querySelector("img.ok"));
    box.addEventListener("imgok", done, { once: true });
    const t0 = Date.now();
    const iv = setInterval(() => {
      const fail = box.querySelector(".sk") && /pas pu/.test(box.textContent);
      if (fail || Date.now() - t0 > 120000) { clearInterval(iv); res(false); }
      if (box.querySelector("img.ok")) clearInterval(iv);
    }, 1000);
  });
  if (okImg) {
    try { await useQuota(); } catch (e) { if (String(e.message) === "LIMIT") { m.t = "Limite du jour atteinte."; } else if (DEBUG) console.error(e); }
    m.t = m.t || "Voici ton image. Dis-moi ce que tu veux changer : couleurs, style, composition…";
    col.lastElementChild.querySelector(".body").insertAdjacentHTML("beforeend", '<div class="txt" style="margin-top:10px">' + md(m.t) + '</div>');
    await store.save(cur); await refreshList();
  } else {
    cur.messages.pop();
    cur.messages.push({ r: "m", t: "Je n'ai pas réussi à créer l'image pour le moment (ton quota du jour n'est pas utilisé). Réessaie dans un instant.", err: true });
    renderChat();
  }
  setBusy(false); scrollDown(true);
}

/* ================= Connexion ================= */
function openLogin(why){
  $("loginWhy").textContent = why || "Retrouve tes anciennes discussions et crée jusqu'à " + CONFIG.DAILY_IMAGES + " images gratuites par jour.";
  $("loginNote").textContent = ""; $("loginModal").classList.remove("hidden"); openSide(false);
}
const closeLogin = () => $("loginModal").classList.add("hidden");
$("loginBtn").onclick = () => openLogin();
$("loginClose").onclick = closeLogin; $("guestBtn").onclick = closeLogin;
$("loginModal").addEventListener("click", e => { if (e.target.id === "loginModal") closeLogin(); });
function lnote(t, ok){ const n = $("loginNote"); n.textContent = t; n.classList.toggle("ok", !!ok); }
$("googleBtn").onclick = async () => {
  lnote("Ouverture de Google…", true);
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, p); closeLogin(); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment" || e.code === "auth/web-storage-unsupported") { try { await signInWithRedirect(auth, p); return; } catch (x) { e = x; } }
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") { lnote(""); return; }
    lnote(e.code === "auth/unauthorized-domain" ? "Ce domaine n'est pas autorisé dans Firebase." : e.code === "auth/operation-not-allowed" ? "La connexion Google n'est pas encore activée." : "Connexion impossible (" + (e.code || e.message) + ")");
  }
};
getRedirectResult(auth).catch(() => {});
let confirmation = null, verifier = null;
$("phoneSend").onclick = async () => {
  const n = normPhone($("phone").value);
  if (!/^\d{8,15}$/.test(n) || (n.slice(0, 3) === "243" && n.length !== 12)) { lnote("Numéro invalide. Écris-le comme d'habitude, ex. 081 234 5678."); return; }
  lnote("Envoi du SMS…", true); $("phoneSend").disabled = true;
  try {
    if (!verifier) verifier = new RecaptchaVerifier(auth, "recaptcha", { size: "invisible" });
    confirmation = await signInWithPhoneNumber(auth, "+" + n, verifier);
    $("phStep1").classList.add("hidden"); $("phStep2").classList.remove("hidden"); lnote("Code envoyé par SMS au +" + n + ".", true); $("code").focus();
  } catch (e) {
    try { verifier && verifier.clear(); } catch (x) {} verifier = null;
    const map = { "auth/operation-not-allowed": "La connexion par SMS n'est pas encore activée. Utilise Google pour le moment.", "auth/billing-not-enabled": "La connexion par SMS n'est pas encore activée. Utilise Google pour le moment.", "auth/too-many-requests": "Trop de tentatives. Réessaie plus tard.", "auth/invalid-phone-number": "Numéro invalide." };
    lnote(map[e.code] || "SMS impossible pour le moment. Utilise Google. (" + (e.code || e.message) + ")");
  }
  $("phoneSend").disabled = false;
};
$("codeOk").onclick = async () => {
  const c = $("code").value.trim(); if (c.length < 6 || !confirmation) { lnote("Entre le code à 6 chiffres."); return; }
  try { await confirmation.confirm(c); closeLogin(); $("phStep2").classList.add("hidden"); $("phStep1").classList.remove("hidden"); }
  catch (e) { lnote(e.code === "auth/invalid-verification-code" ? "Code incorrect." : "Validation impossible (" + (e.code || e.message) + ")"); }
};
$("logoutBtn").onclick = async () => { openSide(false); await signOut(auth); toast("Déconnecté"); };

let firstAuth = true;
onAuthStateChanged(auth, async u => {
  const wasUser = user && user.uid;
  user = u; modelObj = null; renderUser();
  if (u) {
    try { await setDoc(doc(db, "users", u.uid), { name: u.displayName || "", email: u.email || "", phone: u.phoneNumber || "", lastSeen: serverTimestamp() }, { merge: true }); } catch (e) {}
  }
  await loadQuota();
  chats = await store.list();
  if (u && chats.length && (firstAuth || wasUser !== u.uid) && (!cur || !cur.messages.length)) {
    // le client est reconnu : on rouvre sa dernière discussion
    const c = await store.get(chats[0].id);
    if (c) { cur = { id: chats[0].id, title: c.title, messages: c.messages || [] }; $("ttl").textContent = cur.title; renderChat(); }
  } else if (!cur || !cur.messages.length) { newChat(); }
  else if (!u && wasUser) { newChat(); }
  else if (cur && !cur.messages.length) renderWelcome();
  renderHist(); firstAuth = false;
});
